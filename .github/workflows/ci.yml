name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # hassfest and HACS rules change with Home Assistant releases: re-validate daily.
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  python:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # logrono-bus comes from [tool.uv.sources] (a fixed commit of chiva/logrono-bus) until 0.1.0
      # is on PyPI; once that table is removed, this tests the PyPI release users get.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml
      - name: Dashboard card bundle is present
        run: test -s custom_components/logrono_bus/frontend/logrono-bus-card.js
      - name: Manifest requirement matches the tested library
        run: |
          manifest="$(python3 -c 'import json; print(json.load(open("custom_components/logrono_bus/manifest.json"))["requirements"][0])')"
          grep -q "\"$manifest\"" pyproject.toml || { echo "::error::manifest pins $manifest, pyproject differs"; exit 1; }

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
